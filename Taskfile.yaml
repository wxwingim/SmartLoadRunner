version: "3"

# Глобальные переменные проекта
vars:
  GO_VERSION: '1.26'
  GOLANGCI_LINT_VERSION: 'v2.10.1'
  GCI_VERSION: 'v0.13.7'
  GOFUMPT_VERSION: 'v0.9.2'
  BIN_DIR: '{{.ROOT_DIR}}/bin'
  GOLANGCI_LINT: '{{.BIN_DIR}}/golangci-lint'
  GCI: '{{.BIN_DIR}}/gci'
  GOFUMPT: '{{.BIN_DIR}}/gofumpt'
  VERSION: '0.1.0'
  LDFLAGS: '-s -w -X main.version={{.VERSION}}'

tasks:
  # ============================================================
  # Сборка
  # ============================================================
  build:
    desc: Собрать все бинарники
    cmds:
      - task: build:coordinator
      - task: build:runner

  build:coordinator:
    desc: Собрать coordinator
    cmds:
      - |
        mkdir -p {{.BIN_DIR}}
        CGO_ENABLED=0 go build -ldflags '{{.LDFLAGS}}' -o {{.BIN_DIR}}/coordinator ./cmd/coordinator

  build:runner:
    desc: Собрать runner
    cmds:
      - |
        mkdir -p {{.BIN_DIR}}
        CGO_ENABLED=0 go build -ldflags '{{.LDFLAGS}}' -o {{.BIN_DIR}}/runner ./cmd/runner

  # ============================================================
  # Тесты
  # ============================================================
  test:
    desc: Запустить все тесты с покрытием
    cmds:
      - go test ./... -race -coverprofile={{.BIN_DIR}}/coverage.out

  test:unit:
    desc: Быстрые unit-тесты (без -race)
    cmds:
      - go test ./... -short

  test:integration:
    desc: Интеграционные тесты (требуют Postgres/Redis)
    cmds:
      - go test ./... -tags=integration

  # ============================================================
  # Линтеры и форматирование
  # ============================================================
  install-formatters:
    desc: Установить gofumpt и gci в bin/
    cmds:
      - |
        echo ""
        [ -f {{.GOFUMPT}} ] || {
          echo ""
          GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
        }
        [ -f {{.GCI}} ] || {
          echo ""
          GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
        }
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}

  format:
    desc: Отформатировать код
    deps: [install-formatters]
    cmds:
      - |
        echo ""
        find . -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GOFUMPT}} -extra -w {} +
        echo ""
        find . -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GCI}} write -s standard -s default {} +

  install-golangci-lint:
    desc: Установить golangci-lint в bin/
    cmds:
      - |
        echo ""
        [ -f {{.GOLANGCI_LINT}} ] || {
          mkdir -p {{.BIN_DIR}}
          echo ""
          GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
        }
    status:
      - test -x {{.GOLANGCI_LINT}}

  lint:
    desc: Запустить golangci-lint
    deps: [install-golangci-lint]
    cmds:
      - '{{.GOLANGCI_LINT}} run ./... --config=.golangci.yml'

  # ============================================================
  # Запуск
  # ============================================================
  run:coordinator:
    desc: Запустить coordinator локально
    deps: [build:coordinator]
    cmds:
      - |
        set -a
        [ -f .env ] && source .env
        set +a
        ./bin/coordinator

  run:runner:
    desc: Запустить runner локально
    deps: [build:runner]
    cmds:
      - |
        set -a
        [ -f .env ] && source .env
        set +a
        ./bin/runner

  dev:
    desc: Запустить оба процесса с hot-reload (нужен air)
    cmds:
      - |
        command -v air >/dev/null || {
          echo "air не установлен. Установите: go install github.com/air-verse/air@latest"
          exit 1
        }
        echo ""
        echo "Hot reload запущен. Для выхода: Ctrl+C"
        set -a
        [ -f .env ] && source .env
        set +a
        air

  # ============================================================
  # Docker
  # ============================================================
  docker:build:
    desc: Собрать Docker-образы
    cmds:
      - docker compose build

  docker:up:
    desc: Поднять всё окружение в Docker (db + services)
    cmds:
      - docker compose up -d --build

  docker:down:
    desc: Остановить Docker-окружение
    cmds:
      - docker compose down

  docker:logs:
    desc: Логи Docker-окружения
    cmds:
      - docker compose logs -f --tail=100

  # ============================================================
  # Инфраструктура
  # ============================================================
  db:up:
    desc: Поднять Postgres и Redis для локальной разработки
    cmds:
      - docker compose up -d postgres redis

  db:down:
    desc: Остановить Postgres и Redis
    cmds:
      - docker compose stop postgres redis

  db:psql:
    desc: Подключиться к Postgres
    cmds:
      - docker compose exec postgres psql -U slr -d slr

  redis:cli:
    desc: Подключиться к Redis
    cmds:
      - docker compose exec redis redis-cli

  # ============================================================
  # Утилиты
  # ============================================================
  env:show:
    desc: Показать эффективный .env (без секретов)
    cmds:
      - |
        set -a
        [ -f .env ] && source .env
        set +a
        env | grep -E '^SLR_' | sort

  tidy:
    desc: Убрать лишние зависимости и обновить go.sum
    cmds:
      - go mod tidy

  generate:
    desc: Сгенерировать код (мокки, прото, openapi)
    cmds:
      - go generate ./...
      - go mod tidy

  clean:
    desc: Удалить артефакты сборки
    cmds:
      - rm -rf {{.BIN_DIR}}

  help:
    desc: Показать доступные задачи
    cmds:
      - task --list