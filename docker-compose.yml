# ============================================================
# SmartLoadRunner — Docker Compose окружение
#
# Разработка:      docker compose up -d postgres redis
# Полный запуск:   docker compose up -d --build
#
# Секреты НЕ храните в этом файле — используйте .env
# (см. .env.example). docker-compose автоматически читает .env
# и переменные SLR_* пробрасываются в контейнеры через env_file.
# ============================================================

services:
  # ----------------------------------------------------------
  # PostgreSQL — основное хранилище coordinator
  # ----------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: slr-postgres
    environment:
      POSTGRES_USER: ${SLR_DB_USER:-slr}
      POSTGRES_PASSWORD: ${SLR_DB_PASSWORD:-slr}
      POSTGRES_DB: ${SLR_DB_NAME:-slr}
    ports:
      - "${SLR_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SLR_DB_USER:-slr} -d ${SLR_DB_NAME:-slr}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ----------------------------------------------------------
  # Redis — очереди и кеш (задел)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: slr-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${SLR_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ----------------------------------------------------------
  # Coordinator — центральный сервис (HTTP API)
  # ----------------------------------------------------------
  coordinator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: coordinator
        VERSION: ${SLR_APP_VERSION:-dev}
    container_name: slr-coordinator
    env_file:
      - .env
    environment:
      SLR_DB_HOST: postgres
      SLR_REDIS_HOST: redis
      SLR_RUNNER_COORDINATOR_ADDR: coordinator:8080
    ports:
      - "${SLR_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["full"]
    restart: unless-stopped

  # ----------------------------------------------------------
  # Runner — агент нагрузки (можно масштабировать: --scale runner=N)
  # ----------------------------------------------------------
  runner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: runner
        VERSION: ${SLR_APP_VERSION:-dev}
    container_name: slr-runner
    env_file:
      - .env
    environment:
      SLR_RUNNER_COORDINATOR_ADDR: coordinator:8080
    depends_on:
      - coordinator
    profiles: ["full"]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: